<!doctype html>
<!--
  One theme, defined by the token block at the top of
  client/src/styles.css. Change a value there and the whole site follows.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0F0B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OBD Lighting — LED street, industrial &amp; panel lights in Dhaka</title>
    <meta name="description" content="OBD Lighting, Vatara, Dhaka — importer and supplier of LED street lights, industrial shades, panel lights, bulbs, high bay, downlights and flood lights. Genuine stock, 3-year replacement warranty, trade pricing from 50 pcs." />
    <meta name="author" content="OBD Lighting" />
    <meta name="robots" content="index, follow" />
    <!-- Once the domain is bought, put it in the three places marked
         YOUR-DOMAIN below and uncomment the canonical line. -->
    <!-- <link rel="canonical" href="https://YOUR-DOMAIN/" /> -->

    <!-- How the link looks when it is pasted into WhatsApp or Facebook,
         which is how most of this shop's traffic will arrive. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OBD Lighting" />
    <meta property="og:title" content="OBD Lighting — Total Lighting Solutions" />
    <meta property="og:description" content="LED street, industrial, panel and flood lighting supplied from Vatara, Dhaka. Genuine stock, 3-year replacement warranty, delivery nationwide." />
    <meta property="og:image" content="/logo.webp" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bn_BD" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo-small.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />

    <!-- What Google shows in a local search: the shop, where it is, when it
         is open and how to reach it. -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "LightingStore",
        "name": "OBD Lighting",
        "alternateName": "OSRAM BD",
        "description": "Importer and supplier of LED lighting for homes, offices, factories and roads.",
        "logo": "/logo.webp",
        "telephone": "+8801994999664",
        "email": "Osram.mri@gmail.com",
        "priceRange": "৳৳",
        "currenciesAccepted": "BDT",
        "paymentAccepted": "Cash, bKash, Nagad, Bank transfer",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "House 404, Moni Mohol, Sayed Nogor, Vatara",
          "addressLocality": "Dhaka",
          "postalCode": "1212",
          "addressCountry": "BD"
        },
        "openingHoursSpecification": [{
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"],
          "opens": "09:00",
          "closes": "20:00"
        }],
        "areaServed": { "@type": "Country", "name": "Bangladesh" }
      }

    <div id="root"></div>
    <noscript>
